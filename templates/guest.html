<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Request a karaoke song</title><style>
*{box-sizing:border-box}body{margin:0;background:#181324;color:#fff;font-family:Arial,sans-serif}main{max-width:600px;margin:auto;padding:24px 18px}h1{font-size:28px;margin-bottom:8px}.hint,small{color:#c6b4ce}input,button{font:inherit;border-radius:9px;padding:13px;color:white;border:1px solid #65506c}input{display:block;width:100%;background:#251d32;margin:10px 0 16px}button{background:#8d456d;cursor:pointer}button:disabled{opacity:.55}label{font-weight:bold}.song{padding:16px 0;border-bottom:1px solid #ffffff25;display:flex;gap:12px;align-items:center;justify-content:space-between}.song strong,.song small{display:block;margin-bottom:5px}.song button{white-space:nowrap}.status{padding:12px;background:#32263c;border-radius:9px;min-height:45px;margin:16px 0;overflow-wrap:anywhere}#requests{font-size:14px;line-height:1.6}.row{display:flex;gap:8px}.row input{margin:0;flex:1;min-width:0}#confirmDialog{background:#251d32;color:white;border:1px solid #65506c;border-radius:14px;padding:24px;width:min(430px,90vw)}#confirmDialog::backdrop{background:#0009}.song div{min-width:0;overflow-wrap:anywhere}
</style></head><body><main><h1>♫ Your turn to sing</h1><p class="hint">Choose a song and send it to the host’s queue.</p><label for="name">Your name</label><input id="name" maxlength="80" autocomplete="given-name" placeholder="Who’s singing?"><label for="code">Know the song code?</label><form id="codeForm" class="row"><input id="code" inputmode="numeric" pattern="[0-9]{1,12}" maxlength="12" placeholder="000001" required><button>Request</button></form><div id="status" class="status" role="status">Loading songs…</div><label for="search">Browse songs</label><input id="search" placeholder="Search title, artist, or code"><button id="refresh">Refresh songs</button><div id="songs"></div><h2>Your requests this session</h2><div id="requests">No requests yet.</div><p class="hint">The host controls playback and the order of performances.</p></main><dialog id="confirmDialog"><h2>Send this request?</h2><p id="confirmText"></p><div class="row"><button id="confirm">Send request</button><button id="cancel" style="background:#493b55">Cancel</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let songs=[],pending=null,busy=false,history=[];
function status(text){$('status').textContent=text;}
async function load(){try{const response=await fetch('/api/library');if(!response.ok)throw Error('Unable to load songs.');songs=(await response.json()).songs;render();status('Choose from '+songs.length+' songs.');}catch(e){status(e.message);}}
function choose(song){const singer=$('name').value.trim();if(!singer){status('Please enter your name first.');$('name').focus();return;}pending={song,singer};$('confirmText').textContent=song.code+' · '+song.title+' — Singer: '+singer;$('confirmDialog').showModal();}
function render(){const query=$('search').value.trim().toLowerCase();const list=$('songs');list.replaceChildren();const matches=songs.filter(song=>(song.code+' '+song.title+' '+song.artist).toLowerCase().includes(query));if(!matches.length){list.textContent='No matching songs.';return;}matches.forEach(song=>{const row=document.createElement('div');row.className='song';const details=document.createElement('div');const title=document.createElement('strong');title.textContent=song.title;const meta=document.createElement('small');meta.textContent=song.code+' · '+song.artist+' · '+(song.source_type==='youtube'?'YouTube':'Local');details.append(title,meta);const button=document.createElement('button');button.textContent='+ Request';button.onclick=()=>choose(song);row.append(details,button);list.append(row);});}
$('search').oninput=render;$('refresh').onclick=load;$('codeForm').onsubmit=event=>{event.preventDefault();const code=$('code').value.trim();const song=songs.find(s=>Number(s.code)===Number(code));if(!song){status('Song code not found. Try Refresh songs.');return;}choose(song);};$('cancel').onclick=()=>$('confirmDialog').close();
$('confirm').onclick=async()=>{if(busy||!pending)return;busy=true;$('confirm').disabled=true;const request=pending;try{const response=await fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:request.song.code,singer:request.singer})});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to send request.');status('Added to the queue: '+data.title+' · Code '+data.code);history.push(request.singer+' — '+data.title+' ('+data.code+')');$('requests').replaceChildren();history.forEach(text=>{const row=document.createElement('div');row.textContent=text;$('requests').append(row);});$('confirmDialog').close();}catch(e){status(e.message+' Check with the host before retrying if the connection dropped.');$('confirmDialog').close();}finally{busy=false;$('confirm').disabled=false;}};
load();
</script></body></html>
